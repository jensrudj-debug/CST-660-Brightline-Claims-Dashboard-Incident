[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brightline-telemetry-generator"
version = "0.1.0"
description = "Reproducible synthetic observability data for the Brightline claims-dashboard incident"
readme = "README.md"
requires-python = ">=3.11"
# Exact pins: re-runs must be byte-identical (see CLAUDE.md)
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.4",
    "networkx==3.5",
    "matplotlib==3.10.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
